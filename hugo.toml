baseURL = "https://willcornwell.org/"
# `locale` replaced the deprecated `languageCode` in Hugo 0.158. The BCP-47
# casing matters: it is what the theme turns into og:locale (en_US).
locale = "en-US"
title = "Will Cornwell"
theme = "PaperMod"
publishDir = "public"
enableRobotsTXT = true

[pagination]
  pagerSize = 5

pygmentsUseClasses = true
pygmentsCodeFences = true
defaultContentLanguage = "en"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  author = "Will Cornwell"
  description = "Ecologist | Researcher | Professor"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  hideFooter = true
  disableScrollToTop = false
  images = ["images/will.jpg"] 
  title = "Will Cornwell - Ecologist"
  homeInfoParams = { Title = "Will Cornwell", Content = "Ecologist | Researcher | Professor." }

  [params.profileMode]
    enabled = true
    title = "Will Cornwell"
    subtitle = "Ecological Data Science"
    imageUrl = "images/will.jpg"
    imageTitle = "Photo of Will Cornwell"
    # 2x the 120px display size: the theme resizes to exactly these numbers and
    # emits no srcset, so asking for 120 would ship a 1x image that looks soft
    # on HiDPI screens. extend_head.html pins the rendered box back to 120px.
    imageWidth = 240
    imageHeight = 240

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/wcornwell"

[[params.socialIcons]]
  name = "email"
  url = "mailto:w.cornwell@unsw.edu.au"

[[params.socialIcons]]
  name = "orcid"
  url = "https://orcid.org/0000-0003-4080-4073"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/will-cornwell/"

[[params.socialIcons]]
  name = "instagram"
  url = "https://www.instagram.com/willcornwell_nature/"

[[params.socialIcons]]
  name = "YouTube"
  url = "https://www.youtube.com/@wily98988"

[[params.socialIcons]]
  name = "inaturalist"
  url = "https://www.inaturalist.org/people/45978"

[menu]

[[menu.main]]
  name = "Bio"
  url = "/bio/"
  weight = 1

# The Publications menu entry comes from content/publications.md front matter.

# Deliberately empty: an empty table disables Hugo's default tags/categories.
# No content here is tagged, and leaving the defaults on published two blank
# pages (/tags/, /categories/) and listed them in the sitemap.
[taxonomies]

[outputs]
  home = ["HTML", "RSS", "JSON"]
