name: Refresh publications

# Rebuilds data/publications.json from ORCID + Crossref, commits it if it
# changed, and only then redeploys the site.

on:
  schedule:
    # Sundays 17:00 UTC = Monday morning in Sydney.
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-publications
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch from ORCID and Crossref
        run: python3 scripts/fetch_publications.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No publication changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          COUNT=$(python3 -c "import json;print(json.load(open('data/publications.json'))['count'])")
          git commit -m "Update publications from ORCID (${COUNT} works)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN pushes don't trigger the deploy workflow's `push` event,
  # so call it directly.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/hugo.yml
